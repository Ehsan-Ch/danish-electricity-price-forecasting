[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danish-powertrade"
version = "1.0.0"
description = "Leakage-aware electricity forecasts and battery paper-trade management"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
powertrade = "powertrade.cli:main"

[tool.setuptools.packages.find]
include = ["powertrade*"]
